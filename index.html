D.forEach(p=>{p.tt=TT[p.n]!==undefined?TT[p.n]:(p.ttl===1?"?":"");p.by=BY[p.n]??null});
const GR=[["巨","巨人"],["ヤ","ヤクルト"],["横","DeNA"],["神","阪神"],["広","広島"],["中","中日"],["ソ","ソフトバンク"],["日","日本ハム"],["ロ","ロッテ"],["西","西武"],["オ","オリックス"],["楽","楽天"],["MLB","MLB（現在在籍）"],["OB","OB（引退）"]];
const byGrp=k=>D.map((p,i)=>[p,i]).filter(([p])=>p.cur===k).sort((a,b)=>a[0].n.localeCompare(b[0].n,"ja"));

const CAT={
team:{n:"在籍した球団",opts:()=>Object.entries(T),mk:v=>[`${T[v]}に在籍したことは？`,p=>p.t.includes(v)]},
lg:{n:"リーグ",opts:()=>[["c","セ・リーグ"],["p","パ・リーグ"]],mk:v=>[`${v==="c"?"セ":"パ"}・リーグ在籍経験は？`,p=>lg(p,v==="c"?CE:PA)]},
pos:{n:"主なポジション",opts:()=>Object.entries(POS),mk:v=>[`主なポジションは${POS[v]}？`,p=>p.pos===v]},
dec:{n:"プロ入りの年代",opts:()=>[1950,1960,1970,1980,1990,2000,2010,2020].map(d=>[d,d+"年代"]),mk:v=>[`プロ入りは${v}年代？`,p=>p.y>=+v&&p.y<+v+10]},
etc:{n:"その他",opts:()=>[["act","現役"],["mlb","MLB経験"],["ttl","タイトル・新人王経験"]],mk:v=>[{act:"現役ですか？",mlb:"MLB経験はありますか？",ttl:"タイトル・新人王の経験は？"}[v],p=>v==="ttl"&&p.ttl<0?null:p[v]]},
title:{n:"タイトル",opts:()=>TTL,mk:v=>[`${TNAME[v]}の経験は？`,p=>p.ttl===1&&p.tt==="?"?null:p.tt.includes(v)]},
age:{n:"年齢",opts:()=>[[20,"20代"],[30,"30代"],[40,"40代"],[50,"50代以上"]],mk:v=>[`2026年時点で${+v===50?"50代以上":v+"代"}？`,p=>p.by==null?null:(a=>+v===50?a>=50:a>=+v&&a<+v+10)(2026-p.by)]}};
const MODES={r1:["ランダム1人","1人を10問で当てる。まずはここから"],r3:["ランダム3人","3人まとめて質問。答えは3人分が同時に返る"]};
let S=null;
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pick(n){const r=[];while(r.length<n){const i=Math.floor(Math.random()*D.length);if(!r.includes(i))r.push(i)}return r}
function setCat(c){S.cat=c;const o=CAT[c].opts;S.val=o?o()[0][0]:""}
function start(m){const h=pick(m==="r1"?1:3);
S={m,h,asked:[],x:new Set(),tries:0,msg:"",done:null,g:h.map(()=>-1),gg:h.map(()=>"")};setCat("team");draw()}
function ask(){
if(S.done)return;
const v=S.cat==="chr"?String(S.val).trim().slice(0,2):S.val;
if(!v){S.msg="聞きたい文字を入力してください。";return draw(1)}
if(S.asked.length>=10){S.msg="質問は10回までです。";return draw(1)}
const [q,f]=CAT[S.cat].mk(v);
if(S.asked.some(a=>a.q===q)){S.msg="その質問はもう聞きました。";return draw(1)}
S.asked.push({q,a:S.h.map(i=>{const r=f(D[i]);return r===null?null:!!r})});S.msg="";draw(1)}
function tog(i){S.x.has(i)?S.x.delete(i):S.x.add(i);draw(1)}
function guess(){
const g=S.g;
if(g.some(v=>v<0)){S.msg="選手を全員分えらんでください。";return draw(1)}
if(new Set(g).size<g.length){S.msg="同じ選手が重なっています。";return draw(1)}
S.tries++;const ok=g.filter(v=>S.h.includes(v)).length;
if(ok===S.h.length){S.done="win";S.msg=""}
else{S.msg=S.h.length===1?"ハズレ！もう一度考えよう。":(ok===0?"全員ハズレ…":`${ok}人正解！`)+"（どの選手かは非公開）"}
draw()}
function giveup(){S.done="give";S.msg="";draw()}
const ans=v=>v===null?`<span class="a" style="color:var(--mute);border:1.5px dotted var(--mute)">？ 不明</span>`:v?`<span class="a y">○ はい</span>`:`<span class="a n">× いいえ</span>`;
function draw(keep){
const y=scrollY,el=$("app");
if(!S){el.innerHTML=`<h1>NPB 10問チャレンジ</h1>
<p class="mute">選手を当てる側になって、自分で質問をつくって最大10回まで。球団・ポジション・年代・名前の文字などを組み合わせて絞り込もう。</p>
<div class="modes">${Object.entries(MODES).map(([k,v])=>`<button onclick="start('${k}')"><b>${v[0]}</b><span>${v[1]}</span></button>`).join("")}</div>
<p class="foot">サンプルデータ（${D.length}人）です。球団名は現在の名称に統一し、経歴は概略のため正確性は未検証です。</p>`;scrollTo(0,0);return}
const n=S.h.length,u=S.asked.length,c=CAT[S.cat];
let h=`<div class="board"><div><div class="t">${MODES[S.m][0]}　出題 ${n}人／全${D.length}人</div><b>質問 ${u} / 10</b></div><span class="lamps" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="lamp${i<u?" on":""}"></i>`).join("")}</span></div>`;
if(S.msg)h+=`<p class="msg" role="status">${S.msg}</p>`;

if(S.done){
h+=`<p class="msg">${S.done==="win"?`正解！ 質問${u}回、回答${S.tries}回でクリア。`:"答えはこちら。"}</p><div class="res">`+
S.h.map(i=>{const p=D[i];return `<div><b>${p.n}</b><small>${p.act?"現役":"引退"}／${POS[p.pos]}／${[...p.t].map(k=>T[k]).join("・")}／プロ入り${p.y}年</small></div>`}).join("")+
`</div><button class="pri" style="width:100%" onclick="S=null;draw()">もう一度あそぶ</button>`;
}else{
h+=`<h2>聞いた質問</h2><ul class="log">${u?S.asked.map((a,k)=>`<li><span>${k+1}. ${esc(a.q)}</span><span class="ans">${a.a.map(ans).join("")}</span></li>`).join(""):`<li class="mute">まだ質問していません。下で質問をつくってください。</li>`}</ul>`;
h+=`<h2>質問をつくる（残り ${10-u} 回）</h2><div class="bld"><select aria-label="質問の種類" onchange="setCat(this.value);draw(1)">${Object.entries(CAT).map(([k,v])=>`<option value="${k}"${k===S.cat?" selected":""}>${v.n}</option>`).join("")}</select>`+
(c.opts?`<select aria-label="内容" onchange="S.val=this.value">${c.opts().map(([k,l])=>`<option value="${k}"${String(k)===String(S.val)?" selected":""}>${l}</option>`).join("")}</select>`:`<input aria-label="含まれる文字" maxlength="2" value="${esc(S.val)}" placeholder="例：田" oninput="S.val=this.value">`)+
`<button class="pri" onclick="ask()"${u>=10?" disabled":""}>この質問をする</button></div>`;
h+=`<h2>メモ（タップで候補を消す）</h2>${GR.map(([k,l])=>{const L=byGrp(k);return L.length?`<div class="grp">${l}（${L.length}）</div><div class="chips">${L.map(([p,i])=>`<button class="chip${S.x.has(i)?" x":""}" onclick="tog(${i})" aria-pressed="${S.x.has(i)}">${p.n}</button>`).join("")}</div>`:""}).join("")}`;

h+=`<h2>回答する${S.tries?`（${S.tries}回目まで終了）`:""}</h2><div class="sel">${S.h.map((_,k)=>`<div class="slot"><select aria-label="回答${k+1}人目の球団またはOB" onchange="S.gg[${k}]=this.value;S.g[${k}]=-1;draw(1)"><option value="">${k+1}人目：球団・OBをえらぶ</option>${GR.map(([c,l])=>`<option value="${c}"${S.gg[k]===c?" selected":""}>${l}</option>`).join("")}</select>${S.gg[k]?`<select aria-label="回答${k+1}人目の選手" onchange="S.g[${k}]=+this.value"><option value="-1">選手をえらぶ（${byGrp(S.gg[k]).length}人）</option>${byGrp(S.gg[k]).map(([p,i])=>`<option value="${i}"${S.g[k]===i?" selected":""}>${p.n}</option>`).join("")}</select>`:""}</div>`).join("")}</div>
<div style="display:grid;gap:8px"><button class="pri" onclick="guess()">この${n}人で回答する</button><button onclick="giveup()">あきらめて答えを見る</button></div>`}
